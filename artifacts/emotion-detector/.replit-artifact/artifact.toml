kind = "web"
previewPath = "/"
title = "EmotionDetector"
description = "A privacy-first browser application that uses real open-source facial expression recognition to estimate visible expressions from a webcam in real time."
version = "1.0.0"
id = "artifacts/emotion-detector"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22558

[services.development]
run = "pnpm --filter @workspace/emotion-detector run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/emotion-detector", "run", "build" ]
serve = "static"
publicDir = "artifacts/emotion-detector/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22558"
BASE_PATH = "/"
